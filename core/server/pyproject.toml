# MatVerse Monorepo - Configuração Poetry
# ================================================================================
# Arquitetura Consolidade: MatVerse-Ω+ + Tensor XAI 7D
# ================================================================================

[tool.poetry]
name = "matverse-monorepo"
version = "1.0.0"
description = "Arquitetura consolidada MatVerse com quantum proofs, tensor XAI e ledger imutável"
authors = ["MiniMax Agent"]
readme = "README.md"
license = "MIT"

[tool.poetry.dependencies]
python = "^3.10"
numpy = "^1.24.0"
pydantic = "^2.0.0"
cryptography = "^41.0.0"

[tool.poetry.group.quantum]
optional = true

[tool.poetry.group.quantum.dependencies]
qutip = "^4.7.0"

[tool.poetry.group.ledger]
optional = true

[tool.poetry.group.skills]
optional = true

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
black = "^23.0.0"
mypy = "^1.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.modules]
# Módulos disponíveis no monorepo
modules = [
    "matverse.core",
    "matverse.quantum",
    "matverse.ledger",
    "matverse.skills",
    "matverse.motor"
]
